[package]
name = "explor"
version = "0.1.0"
edition = "2024"

[dependencies]
libadwaita = { version = "0.9.2", features = ["v1_6"] }
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_8"] }
gio = { version = "0.22", package = "gio" }
glib = { version = "0.22", package = "glib" }
dirs = "6.0"
chrono = "0.4"
trash = "5.2"
libc = "0.2"
gdk-pixbuf = { version = "0.22", package = "gdk-pixbuf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
